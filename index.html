<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheather App</title>
    <link rel="stylesheet" href="./style.css">
    
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="Enter city name" spellcheck="false" id="city">
            <button  id="btn" ><img src="./search.png" class="search-icon"></button>
        </div>
        <div class="wheater">
            <img src="./cloud.png" class="weather-icon">
            <p><h1 class="temp" id="temp"></h1></p>
            <h2 class="city" id="name"></h2><br><br>
            <div class="details">
                <div class="col">
                    <img src="./humidity.png" class="humidity-img">
                    <div>
                        <p>Description</p>
                        <h1 id="hum"></h1><br><br>
                    </div>
                </div>
                <div class="col">
                    <img src="./storm.png" class="wind-img">
                    <div>
                        <p>Wind Speed</p>
                        <h1 id="wd"></h1>
                    </div>
                </div>
            </div>
        </div>
    </div>
<script src="./app.js"></script>
</body>
</html>
